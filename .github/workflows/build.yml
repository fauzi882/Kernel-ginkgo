name: Build Custom Kernel Redmi Note 8 (Ginkgo/Willow)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "URL repo source kernel"
        default: "https://github.com/FlopKernel-Series/flop_trinket-mi_kernel.git"
      kernel_branch:
        description: "Branch kernel (kosongkan = default branch repo)"
        default: ""
      defconfig:
        description: "Nama defconfig"
        default: "vendor/ginkgo-perf_defconfig"
      root_solution:
        description: "Root solution"
        type: choice
        options:
          - ksu-next
          - bakasu
        default: ksu-next
      bakasu_branch:
        description: "Branch BakaSU (kalau root_solution=bakasu)"
        default: "main"
      enable_susfs:
        description: "Aktifin SuSFS"
        type: boolean
        default: true
      susfs_branch:
        description: "Branch susfs4ksu (kernel-4.14 untuk RN8 non-GKI)"
        default: "kernel-4.14"
      enable_nethunter_wifi:
        description: "Patch monitor mode WiFi (eksperimental)"
        type: boolean
        default: true
      enable_rtl8188eus:
        description: "Build driver RTL8188EUS"
        type: boolean
        default: true
      enable_tweaks:
        description: "Aktifin semua tweak (gaming, BBR, GPS, baterai, dll)"
        type: boolean
        default: true
      enable_zram:
        description: "Aktifin ZRAM LZ4/ZSTD"
        type: boolean
        default: true
      enable_overclock:
        description: "Aktifin overclock/undervolt sysfs"
        type: boolean
        default: true
      enable_dolby:
        description: "Aktifin tweak audio Dolby Atmos"
        type: boolean
        default: true
      enable_gplay_bypass:
        description: "Google Play integrity bypass support"
        type: boolean
        default: true

jobs:

  resolve-versions:
    runs-on: ubuntu-latest
    outputs:
      ksu_ref: ${{ steps.rv.outputs.ksu_ref }}
      ksu_repo: ${{ steps.rv.outputs.ksu_repo }}
      ksu_branch: ${{ steps.rv.outputs.ksu_branch }}
      bakasu_ref: ${{ steps.rv.outputs.bakasu_ref }}
      bakasu_branch: ${{ steps.rv.outputs.bakasu_branch }}
      susfs_ref: ${{ steps.rv.outputs.susfs_ref }}
      susfs_branch_resolved: ${{ steps.rv.outputs.susfs_branch_resolved }}
    steps:
      - name: Resolve versi terbaru otomatis
        id: rv
        env:
          ROOT_SOLUTION: ${{ inputs.root_solution }}
          BAKASU_BRANCH_INPUT: ${{ inputs.bakasu_branch }}
          SUSFS_BRANCH: ${{ inputs.susfs_branch }}
        run: |
          set -euo pipefail
          resolve_ref() { git ls-remote --heads "$1" "$2" 2>/dev/null | awk '{print $1}' | head -n1; }

          echo "==== Resolving KSU Next ===="
          KSU_REF=$(resolve_ref "https://github.com/pershoot/KernelSU-Next.git" "dev-susfs")
          if [ -n "$KSU_REF" ]; then
            KSU_REPO="pershoot/KernelSU-Next"
            KSU_BRANCH="dev-susfs"
          else
            KSU_REF=$(resolve_ref "https://github.com/KernelSU-Next/KernelSU-Next.git" "dev")
            KSU_REPO="KernelSU-Next/KernelSU-Next"
            KSU_BRANCH="dev"
          fi
          [ -n "$KSU_REF" ] || { echo "ERROR: KSU Next tidak bisa di-resolve"; exit 1; }
          echo "KSU Next: $KSU_REPO@$KSU_BRANCH => $KSU_REF"

          echo "==== Resolving BakaSU ===="
          BAKASU_REF=$(resolve_ref "https://github.com/Baka-SU/BakaSU.git" "$BAKASU_BRANCH_INPUT")
          BAKASU_BRANCH_RESOLVED="$BAKASU_BRANCH_INPUT"
          if [ -z "$BAKASU_REF" ]; then
            for br in main master next dev; do
              BAKASU_REF=$(resolve_ref "https://github.com/Baka-SU/BakaSU.git" "$br")
              if [ -n "$BAKASU_REF" ]; then BAKASU_BRANCH_RESOLVED="$br"; break; fi
            done
          fi
          [ -n "$BAKASU_REF" ] || { BAKASU_REF="not-resolved"; echo "WARNING: BakaSU tidak ditemukan"; }
          echo "BakaSU: $BAKASU_BRANCH_RESOLVED => $BAKASU_REF"

          echo "==== Resolving SuSFS ===="
          SUSFS_REF=$(resolve_ref "https://gitlab.com/simonpunk/susfs4ksu.git" "$SUSFS_BRANCH")
          SUSFS_BRANCH_RESOLVED="$SUSFS_BRANCH"
          if [ -z "$SUSFS_REF" ]; then
            echo "Branch '$SUSFS_BRANCH' tidak ketemu, coba branch lain..."
            for br in kernel-4.14 kernel-4.19 kernel-4.9 kernel-5.4 gki-android12-5.10; do
              SUSFS_REF=$(resolve_ref "https://gitlab.com/simonpunk/susfs4ksu.git" "$br")
              if [ -n "$SUSFS_REF" ]; then
                SUSFS_BRANCH_RESOLVED="$br"
                echo "Pakai fallback branch: $br => $SUSFS_REF"
                break
              fi
            done
          fi
          [ -n "$SUSFS_REF" ] || { echo "ERROR: susfs4ksu tidak ditemukan"; exit 1; }
          echo "SuSFS: $SUSFS_BRANCH_RESOLVED => $SUSFS_REF"

          echo "ksu_ref=$KSU_REF" >> "$GITHUB_OUTPUT"
          echo "ksu_repo=$KSU_REPO" >> "$GITHUB_OUTPUT"
          echo "ksu_branch=$KSU_BRANCH" >> "$GITHUB_OUTPUT"
          echo "bakasu_ref=$BAKASU_REF" >> "$GITHUB_OUTPUT"
          echo "bakasu_branch=$BAKASU_BRANCH_RESOLVED" >> "$GITHUB_OUTPUT"
          echo "susfs_ref=$SUSFS_REF" >> "$GITHUB_OUTPUT"
          echo "susfs_branch_resolved=$SUSFS_BRANCH_RESOLVED" >> "$GITHUB_OUTPUT"

          echo "=== VERSI TERBARU ==="
          echo "  KSU Next  : $KSU_REPO @ $KSU_BRANCH => $KSU_REF"
          echo "  BakaSU    : Baka-SU/BakaSU @ $BAKASU_BRANCH_RESOLVED => $BAKASU_REF"
          echo "  SuSFS     : simonpunk/susfs4ksu @ $SUSFS_BRANCH_RESOLVED => $SUSFS_REF"

  build-kernel:
    runs-on: ubuntu-latest
    needs: resolve-versions
    timeout-minutes: 180
    env:
      ZIP_NAME: "GinkgoWillow-${{ inputs.root_solution }}-${{ github.run_number }}.zip"
      KSU_REF: ${{ needs.resolve-versions.outputs.ksu_ref }}
      KSU_REPO: ${{ needs.resolve-versions.outputs.ksu_repo }}
      KSU_BRANCH: ${{ needs.resolve-versions.outputs.ksu_branch }}
      BAKASU_REF: ${{ needs.resolve-versions.outputs.bakasu_ref }}
      BAKASU_BRANCH: ${{ needs.resolve-versions.outputs.bakasu_branch }}
      SUSFS_REF: ${{ needs.resolve-versions.outputs.susfs_ref }}
      SUSFS_BRANCH_RESOLVED: ${{ needs.resolve-versions.outputs.susfs_branch_resolved }}

    steps:

      - name: Setup environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git bc bison flex make zip curl cpio rsync \
            xz-utils lz4 lzop libssl-dev libelf-dev \
            libncurses-dev device-tree-compiler python3 \
            clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          clang --version | head -n1
          echo "NPROC=$(nproc)" >> "$GITHUB_ENV"

      - name: Clone kernel source
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        run: |
          if [ -n "$KERNEL_BRANCH" ]; then
            git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel-source
          else
            git clone --depth=1 "$KERNEL_REPO" kernel-source
          fi

      - name: Diagnosa kernel source
        working-directory: kernel-source
        run: |
          echo "=== Versi kernel ==="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) ' Makefile || true
          git log -1 --format='%h %s (%cd)' || true
          echo "=== Defconfig tersedia ==="
          find arch/arm64/configs -name '*.defconfig' | sort
          echo "=== KSU status (cek apakah sudah built-in) ==="
          if [ -d drivers/kernelsu ]; then
            echo "FOUND: drivers/kernelsu sudah ada"
            ls drivers/kernelsu/
          else
            echo "NOT FOUND: drivers/kernelsu belum ada"
          fi
          grep -rIl -i susfs --exclude-dir=.git \
            --include='*.c' --include='*.h' \
            --include='Kconfig' --include='Makefile' . 2>/dev/null | head -n 5 || true

      - name: Cari defconfig yang valid
        working-directory: kernel-source
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          DEF_PATH=$(find arch/arm64/configs -name "$DEFCONFIG" 2>/dev/null | head -n1)
          if [ -z "$DEF_PATH" ]; then
            echo "defconfig '$DEFCONFIG' tidak ditemukan, cari alternatif..."
            for candidate in \
              vendor/ginkgo-perf_defconfig \
              vendor/ginkgo_defconfig \
              ginkgo-perf_defconfig \
              ginkgo_defconfig \
              vendor/willow-perf_defconfig \
              vendor/willow_defconfig \
              willow_defconfig \
              vendor/trinket_defconfig \
              trinket_defconfig; do
              FOUND=$(find arch/arm64/configs -name "$candidate" 2>/dev/null | head -n1)
              if [ -n "$FOUND" ]; then
                DEF_PATH="$FOUND"
                echo "Pakai: $DEF_PATH"
                break
              fi
            done
          fi
          if [ -z "$DEF_PATH" ]; then
            echo "ERROR: Tidak ada defconfig yang cocok"
            find arch/arm64/configs -name '*.defconfig' | sort
            exit 1
          fi
          DEFCONFIG_REL="${DEF_PATH#arch/arm64/configs/}"
          echo "DEFCONFIG_REL=$DEFCONFIG_REL" >> "$GITHUB_ENV"
          echo "DEF_PATH=$DEF_PATH" >> "$GITHUB_ENV"
          echo "=== Pakai defconfig: $DEF_PATH ==="

      - name: Integrasi root solution (dengan bersihkan yang lama)
        working-directory: kernel-source
        env:
          ROOT_SOLUTION: ${{ inputs.root_solution }}
          ENABLE_SUSFS: ${{ inputs.enable_susfs }}
        run: |
          echo "=== Bersihkan folder KSU lama jika ada ==="
          if [ -d drivers/kernelsu ]; then
            echo "NOTICE: drivers/kernelsu sudah ada, hapus dulu..."
            rm -rf drivers/kernelsu
          fi
          for d in KernelSU KernelSU-Next kernelsu; do
            [ -d "$d" ] || [ -L "$d" ] && rm -rf "$d" && echo "Hapus: $d" || true
          done

          if [ "$ROOT_SOLUTION" = "bakasu" ]; then
            USE_REPO="Baka-SU/BakaSU"
            USE_REF="$BAKASU_REF"
            USE_BRANCH="$BAKASU_BRANCH"
            echo "=== BakaSU @ $USE_BRANCH ($USE_REF) ==="
          else
            USE_REPO="$KSU_REPO"
            USE_REF="$KSU_REF"
            USE_BRANCH="$KSU_BRANCH"
            echo "=== KSU Next @ $USE_BRANCH ($USE_REF) ==="
          fi

          echo "=== Coba setup.sh resmi ==="
          SETUP_URL="https://raw.githubusercontent.com/${USE_REPO}/${USE_REF}/kernel/setup.sh"
          SETUP_OK=false

          if curl -fLsS --max-time 30 "$SETUP_URL" -o /tmp/setup.sh 2>/dev/null; then
            if bash /tmp/setup.sh "$USE_REF" 2>&1; then
              if [ -d drivers/kernelsu ] && [ -f drivers/kernelsu/Kconfig ]; then
                SETUP_OK=true
                echo "=== setup.sh berhasil ==="
              else
                echo "=== setup.sh jalan tapi drivers/kernelsu tidak terbentuk, coba legacy ==="
              fi
            else
              echo "=== setup.sh exit error, coba legacy ==="
            fi
            rm -f /tmp/setup.sh
          else
            echo "=== setup.sh tidak bisa diunduh, langsung legacy ==="
          fi

          if [ "$SETUP_OK" = "false" ]; then
            echo "=== Legacy method: clone + copy kernel/ => drivers/kernelsu/kernel/ ==="
            rm -rf drivers/kernelsu
            CLONE_URL="https://github.com/${USE_REPO}.git"
            git clone --depth=1 -b "$USE_BRANCH" "$CLONE_URL" /tmp/ksu-src 2>&1 ||               git clone --depth=1 "$CLONE_URL" /tmp/ksu-src 2>&1
            git -C /tmp/ksu-src log -1 --format='%h %s'

            # Cek struktur KSU repo: ada folder kernel/ atau langsung file?
            if [ -d /tmp/ksu-src/kernel ]; then
              echo "Struktur: repo punya subfolder kernel/"
              # Source ini (flop_trinket) expect drivers/kernelsu/kernel/Kconfig
              # Jadi copy jadi drivers/kernelsu/kernel/
              mkdir -p drivers/kernelsu/kernel
              cp -r /tmp/ksu-src/kernel/. drivers/kernelsu/kernel/
              # Buat Makefile wrapper di drivers/kernelsu/
              echo 'obj-$(CONFIG_KSU) += kernel/' > drivers/kernelsu/Makefile
            else
              echo "Struktur: repo tidak punya subfolder kernel/, copy langsung"
              mkdir -p drivers/kernelsu
              cp -r /tmp/ksu-src/. drivers/kernelsu/
            fi
            rm -rf /tmp/ksu-src
            echo "=== Legacy copy selesai ==="
            echo "=== Isi drivers/kernelsu/ ==="
            ls -la drivers/kernelsu/
          fi

          echo "=== Pastiin drivers/Makefile dan drivers/Kconfig ==="
          grep -q 'kernelsu' drivers/Makefile 2>/dev/null ||             echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

          # Cek path Kconfig yang benar (kernel/Kconfig atau Kconfig langsung)
          if [ -f drivers/kernelsu/kernel/Kconfig ]; then
            KSU_KCONFIG_PATH="drivers/kernelsu/kernel/Kconfig"
          elif [ -f drivers/kernelsu/Kconfig ]; then
            KSU_KCONFIG_PATH="drivers/kernelsu/Kconfig"
          else
            echo "ERROR: Kconfig tidak ditemukan di drivers/kernelsu/"
            find drivers/kernelsu/ -name 'Kconfig' 2>/dev/null || true
            exit 1
          fi
          echo "KSU Kconfig path: $KSU_KCONFIG_PATH"

          # Update drivers/Kconfig agar source ke path yang benar
          if ! grep -q "$KSU_KCONFIG_PATH" drivers/Kconfig 2>/dev/null; then
            # Hapus entry kernelsu lama yang mungkin pointing ke path salah
            sed -i '/source.*kernelsu.*Kconfig/d' drivers/Kconfig 2>/dev/null || true
            sed -i "/^endmenu/i source "$KSU_KCONFIG_PATH"" drivers/Kconfig
            echo "=== Ditambahkan ke drivers/Kconfig: $KSU_KCONFIG_PATH ==="
          fi

          # Cek juga su_variants.Kconfig jika ada — sesuaikan referensinya
          if [ -f drivers/su_variants.Kconfig ]; then
            echo "=== Cek drivers/su_variants.Kconfig ==="
            grep -n 'kernelsu' drivers/su_variants.Kconfig | head -n 10 || true
            # Jika su_variants.Kconfig reference ke path yang salah, fix
            SV_REF=$(grep 'kernelsu.*Kconfig' drivers/su_variants.Kconfig | head -n1 |                      grep -oE '"drivers/kernelsu[^"]*"' | tr -d '"' || true)
            if [ -n "$SV_REF" ] && [ ! -f "$SV_REF" ]; then
              echo "su_variants.Kconfig reference ke $SV_REF yang tidak ada, fix..."
              sed -i "s|source "$SV_REF"|source "$KSU_KCONFIG_PATH"|g"                 drivers/su_variants.Kconfig
              echo "=== su_variants.Kconfig diperbaiki ==="
            fi
          fi

          echo "=== Verifikasi akhir ==="
          test -f "$KSU_KCONFIG_PATH" || { echo "ERROR: $KSU_KCONFIG_PATH tidak ada"; exit 1; }
          echo "=== Integrasi berhasil ==="
          ls -la drivers/kernelsu/
          grep kernelsu drivers/Makefile || true
          echo "=== Config symbols ==="
          grep -rhoE 'config [A-Z_]+' drivers/kernelsu/ --include='Kconfig' | sort -u

      - name: Patch SuSFS
        if: ${{ inputs.enable_susfs }}
        working-directory: kernel-source
        run: |
          echo "=== Clone SuSFS branch: $SUSFS_BRANCH_RESOLVED ==="
          git clone --depth=1 -b "$SUSFS_BRANCH_RESOLVED" \
            https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          git -C ../susfs4ksu log -1 --format='%h %s (%cd)'

          PATCH=$(ls ../susfs4ksu/kernel_patches/50_add_susfs_in_*.patch 2>/dev/null | head -n1)
          [ -n "$PATCH" ] || { echo "ERROR: patch 50_add_susfs tidak ada"; exit 1; }
          echo "Patch: $PATCH"

          if ! patch -p1 --dry-run --forward < "$PATCH" > /tmp/dry.log 2>&1; then
            awk '/^checking file/{f=$3} /out of .* hunks? FAILED/{print f": "$0}' /tmp/dry.log
            if grep -qi "previously applied" /tmp/dry.log; then
              echo "NOTICE: SuSFS sudah built-in. Lanjut."
            else
              echo "ERROR: Patch SuSFS tidak cocok, cek susfs_branch"
              exit 1
            fi
          else
            patch -p1 --forward --no-backup-if-mismatch < "$PATCH"
            find . -name '*.rej' | grep . && exit 1 || true
          fi

          SRC=../susfs4ksu/kernel_patches
          [ -d "$SRC/fs" ]            && cp -rn "$SRC/fs/."           fs/
          [ -d "$SRC/include/linux" ] && cp -rn "$SRC/include/linux/." include/linux/
          test -f include/linux/susfs.h || { echo "ERROR: susfs.h tidak ada"; exit 1; }
          echo "=== SuSFS patch berhasil ==="

      - name: Patch NetHunter WiFi monitor mode
        if: ${{ inputs.enable_nethunter_wifi }}
        working-directory: kernel-source
        run: |
          curl -fLsS -o monitor_mode.patch \
            https://github.com/kimocoder/qualcomm_android_monitor_mode/raw/master/files/enable_monitor_mode.patch
          if patch -p1 --dry-run --forward < monitor_mode.patch > /tmp/wifi.log 2>&1; then
            patch -p1 --forward --no-backup-if-mismatch < monitor_mode.patch
            echo "=== Monitor mode berhasil ==="
          else
            grep -qi "previously applied" /tmp/wifi.log && \
              echo "NOTICE: Monitor mode sudah built-in" || \
              echo "WARNING: Patch tidak cocok, lanjut tanpa patch"
          fi
          rm -f monitor_mode.patch

      - name: Tambah configs ke defconfig
        if: ${{ inputs.enable_tweaks }}
        working-directory: kernel-source
        env:
          ENABLE_ZRAM: ${{ inputs.enable_zram }}
          ENABLE_OVERCLOCK: ${{ inputs.enable_overclock }}
          ENABLE_DOLBY: ${{ inputs.enable_dolby }}
          ENABLE_GPLAY: ${{ inputs.enable_gplay_bypass }}
        run: |
          echo "Menulis configs ke: $DEF_PATH"

          echo "" >> "$DEF_PATH"
          echo "# CPU Governor" >> "$DEF_PATH"
          echo "CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y" >> "$DEF_PATH"
          echo "CONFIG_CPU_FREQ_GOV_PERFORMANCE=y" >> "$DEF_PATH"
          echo "CONFIG_CPU_FREQ_GOV_POWERSAVE=y" >> "$DEF_PATH"
          echo "CONFIG_CPU_FREQ_GOV_USERSPACE=y" >> "$DEF_PATH"
          echo "CONFIG_CPU_FREQ_GOV_CONSERVATIVE=y" >> "$DEF_PATH"
          echo "CONFIG_CPU_FREQ_GOV_ONDEMAND=y" >> "$DEF_PATH"
          echo "CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y" >> "$DEF_PATH"

          echo "" >> "$DEF_PATH"
          echo "# Gaming Performance FPS" >> "$DEF_PATH"
          echo "CONFIG_SCHED_WALT=y" >> "$DEF_PATH"
          echo "CONFIG_SCHED_WALT_HMP=y" >> "$DEF_PATH"
          echo "CONFIG_SCHED_BOOST=y" >> "$DEF_PATH"
          echo "CONFIG_CPU_BOOST=y" >> "$DEF_PATH"
          echo "CONFIG_ENERGY_MODEL=y" >> "$DEF_PATH"
          echo "CONFIG_MQ_IOSCHED_KYBER=y" >> "$DEF_PATH"
          echo "CONFIG_IOSCHED_BFQ=y" >> "$DEF_PATH"
          echo "CONFIG_MQ_IOSCHED_BFQ=y" >> "$DEF_PATH"
          echo "CONFIG_MEMCG=y" >> "$DEF_PATH"
          echo "CONFIG_MEMCG_SWAP=y" >> "$DEF_PATH"
          echo "CONFIG_THERMAL=y" >> "$DEF_PATH"
          echo "CONFIG_CPU_THERMAL=y" >> "$DEF_PATH"

          echo "" >> "$DEF_PATH"
          echo "# TCP BBR BBR2" >> "$DEF_PATH"
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> "$DEF_PATH"
          echo "CONFIG_TCP_CONG_BBR=y" >> "$DEF_PATH"
          echo "CONFIG_TCP_CONG_BBR2=y" >> "$DEF_PATH"
          echo "CONFIG_TCP_CONG_WESTWOOD=y" >> "$DEF_PATH"
          echo "CONFIG_TCP_CONG_HTCP=y" >> "$DEF_PATH"
          echo "CONFIG_TCP_CONG_CUBIC=y" >> "$DEF_PATH"
          echo "CONFIG_DEFAULT_BBR=y" >> "$DEF_PATH"
          echo "CONFIG_NET_SCH_CAKE=y" >> "$DEF_PATH"
          echo "CONFIG_NET_SCH_FQ=y" >> "$DEF_PATH"
          echo "CONFIG_NET_SCH_FQ_CODEL=y" >> "$DEF_PATH"
          echo "CONFIG_TCP_FASTOPEN=y" >> "$DEF_PATH"
          echo "CONFIG_NET_RX_BUSY_POLL=y" >> "$DEF_PATH"

          echo "" >> "$DEF_PATH"
          echo "# Netfilter" >> "$DEF_PATH"
          echo "CONFIG_NETFILTER_ADVANCED=y" >> "$DEF_PATH"
          echo "CONFIG_NF_CONNTRACK=y" >> "$DEF_PATH"
          echo "CONFIG_NETFILTER_NETLINK=y" >> "$DEF_PATH"
          echo "CONFIG_NETFILTER_NETLINK_QUEUE=y" >> "$DEF_PATH"
          echo "CONFIG_NETFILTER_XT_TARGET_NFQUEUE=y" >> "$DEF_PATH"
          echo "CONFIG_IP_NF_IPTABLES=y" >> "$DEF_PATH"
          echo "CONFIG_IP_NF_MANGLE=y" >> "$DEF_PATH"
          echo "CONFIG_IP6_NF_IPTABLES=y" >> "$DEF_PATH"
          echo "CONFIG_IP6_NF_MANGLE=y" >> "$DEF_PATH"
          echo "CONFIG_NF_TABLES=y" >> "$DEF_PATH"

          echo "" >> "$DEF_PATH"
          echo "# Sinyal WiFi BT LTE" >> "$DEF_PATH"
          echo "CONFIG_CFG80211=y" >> "$DEF_PATH"
          echo "CONFIG_CFG80211_WEXT=y" >> "$DEF_PATH"
          echo "CONFIG_MAC80211=y" >> "$DEF_PATH"
          echo "CONFIG_MAC80211_RC_MINSTREL=y" >> "$DEF_PATH"
          echo "CONFIG_MAC80211_RC_MINSTREL_HT=y" >> "$DEF_PATH"
          echo "CONFIG_ATH10K=y" >> "$DEF_PATH"
          echo "CONFIG_ATH10K_PCI=y" >> "$DEF_PATH"
          echo "CONFIG_ATH10K_AHB=y" >> "$DEF_PATH"
          echo "CONFIG_BT=y" >> "$DEF_PATH"
          echo "CONFIG_BT_HCIUART=y" >> "$DEF_PATH"
          echo "CONFIG_BT_HCIUART_H4=y" >> "$DEF_PATH"
          echo "CONFIG_BT_HCIUART_QCA=y" >> "$DEF_PATH"
          echo "CONFIG_BT_HIDP=y" >> "$DEF_PATH"
          echo "CONFIG_BT_RFCOMM=y" >> "$DEF_PATH"
          echo "CONFIG_BT_LE=y" >> "$DEF_PATH"
          echo "CONFIG_RMNET=y" >> "$DEF_PATH"
          echo "CONFIG_MSM_IPC_ROUTER=y" >> "$DEF_PATH"

          echo "" >> "$DEF_PATH"
          echo "# GPS GNSS" >> "$DEF_PATH"
          echo "CONFIG_GNSS=y" >> "$DEF_PATH"
          echo "CONFIG_GNSS_SERIAL=y" >> "$DEF_PATH"
          echo "CONFIG_MSM_GPS=y" >> "$DEF_PATH"
          echo "CONFIG_MSM_SUBSYSTEM_RESTART=y" >> "$DEF_PATH"
          echo "CONFIG_HIGH_RES_TIMERS=y" >> "$DEF_PATH"
          echo "CONFIG_HZ_300=y" >> "$DEF_PATH"
          echo "CONFIG_NO_HZ_FULL=y" >> "$DEF_PATH"
          echo "CONFIG_IP_MULTICAST=y" >> "$DEF_PATH"

          echo "" >> "$DEF_PATH"
          echo "# Baterai EAS" >> "$DEF_PATH"
          echo "CONFIG_CPU_IDLE=y" >> "$DEF_PATH"
          echo "CONFIG_CPU_IDLE_GOV_LADDER=y" >> "$DEF_PATH"
          echo "CONFIG_CPU_IDLE_GOV_MENU=y" >> "$DEF_PATH"
          echo "CONFIG_ARM_CPUIDLE=y" >> "$DEF_PATH"
          echo "CONFIG_PM=y" >> "$DEF_PATH"
          echo "CONFIG_SUSPEND=y" >> "$DEF_PATH"
          echo "CONFIG_PM_AUTOSLEEP=y" >> "$DEF_PATH"
          echo "CONFIG_PM_WAKELOCKS=y" >> "$DEF_PATH"
          echo "CONFIG_PM_WAKELOCKS_LIMIT=100" >> "$DEF_PATH"
          echo "CONFIG_WAKELOCK=y" >> "$DEF_PATH"
          echo "CONFIG_ANDROID_LOW_MEMORY_KILLER=y" >> "$DEF_PATH"
          echo "CONFIG_ANDROID_SIMPLE_LMK=y" >> "$DEF_PATH"
          echo "CONFIG_QPNP_SMB5=y" >> "$DEF_PATH"

          echo "" >> "$DEF_PATH"
          echo "# Display Video Codec" >> "$DEF_PATH"
          echo "CONFIG_DRM=y" >> "$DEF_PATH"
          echo "CONFIG_DRM_MSM=y" >> "$DEF_PATH"
          echo "CONFIG_FB=y" >> "$DEF_PATH"
          echo "CONFIG_VIDEO_V4L2=y" >> "$DEF_PATH"
          echo "CONFIG_MEDIA_SUPPORT=y" >> "$DEF_PATH"
          echo "CONFIG_MEDIA_CAMERA_SUPPORT=y" >> "$DEF_PATH"
          echo "CONFIG_VIDEO_QCOM_VENUS=y" >> "$DEF_PATH"
          echo "CONFIG_SYNC=y" >> "$DEF_PATH"
          echo "CONFIG_ION=y" >> "$DEF_PATH"
          echo "CONFIG_ION_MSM=y" >> "$DEF_PATH"
          echo "CONFIG_DMA_SHARED_BUFFER=y" >> "$DEF_PATH"

          echo "" >> "$DEF_PATH"
          echo "# USB Gadget HID" >> "$DEF_PATH"
          echo "CONFIG_USB_CONFIGFS=y" >> "$DEF_PATH"
          echo "CONFIG_USB_CONFIGFS_F_HID=y" >> "$DEF_PATH"
          echo "CONFIG_HID=y" >> "$DEF_PATH"
          echo "CONFIG_USB_GADGET=y" >> "$DEF_PATH"
          echo "CONFIG_USB_CONFIGFS_RNDIS=y" >> "$DEF_PATH"
          echo "CONFIG_USB_CONFIGFS_MASS_STORAGE=y" >> "$DEF_PATH"

          echo "" >> "$DEF_PATH"
          echo "# Security" >> "$DEF_PATH"
          echo "CONFIG_STACKPROTECTOR_STRONG=y" >> "$DEF_PATH"
          echo "CONFIG_FORTIFY_SOURCE=y" >> "$DEF_PATH"
          echo "CONFIG_HARDENED_USERCOPY=y" >> "$DEF_PATH"
          echo "CONFIG_SECURITY_DMESG_RESTRICT=y" >> "$DEF_PATH"
          echo "CONFIG_RANDOMIZE_BASE=y" >> "$DEF_PATH"

          if [ "$ENABLE_ZRAM" = "true" ]; then
            echo "" >> "$DEF_PATH"
            echo "# ZRAM" >> "$DEF_PATH"
            echo "CONFIG_ZRAM=y" >> "$DEF_PATH"
            echo "CONFIG_ZRAM_DEF_COMP_LZ4=y" >> "$DEF_PATH"
            echo "CONFIG_ZRAM_DEF_COMP_ZSTD=y" >> "$DEF_PATH"
            echo "CONFIG_LZ4_COMPRESS=y" >> "$DEF_PATH"
            echo "CONFIG_LZ4HC_COMPRESS=y" >> "$DEF_PATH"
            echo "CONFIG_ZSTD_COMPRESS=y" >> "$DEF_PATH"
            echo "CONFIG_ZSTD_DECOMPRESS=y" >> "$DEF_PATH"
            echo "CONFIG_ZSMALLOC=y" >> "$DEF_PATH"
            echo "CONFIG_ZSWAP=y" >> "$DEF_PATH"
            echo "CONFIG_ZBUD=y" >> "$DEF_PATH"
          fi

          if [ "$ENABLE_OVERCLOCK" = "true" ]; then
            echo "" >> "$DEF_PATH"
            echo "# Overclock Undervolt" >> "$DEF_PATH"
            echo "CONFIG_CPU_FREQ_STAT=y" >> "$DEF_PATH"
            echo "CONFIG_CPU_FREQ_TIMES=y" >> "$DEF_PATH"
            echo "CONFIG_PM_DEVFREQ=y" >> "$DEF_PATH"
            echo "CONFIG_DEVFREQ_GOV_SIMPLE_ONDEMAND=y" >> "$DEF_PATH"
            echo "CONFIG_DEVFREQ_GOV_PERFORMANCE=y" >> "$DEF_PATH"
            echo "CONFIG_DEVFREQ_GOV_USERSPACE=y" >> "$DEF_PATH"
            echo "CONFIG_REGULATOR=y" >> "$DEF_PATH"
            echo "CONFIG_REGULATOR_USERSPACE_CONSUMER=y" >> "$DEF_PATH"
            echo "CONFIG_MSM_PERFORMANCE=y" >> "$DEF_PATH"
            echo "CONFIG_CPU_FREQ_LIMIT=y" >> "$DEF_PATH"
          fi

          if [ "$ENABLE_DOLBY" = "true" ]; then
            echo "" >> "$DEF_PATH"
            echo "# Audio Dolby Atmos SD665" >> "$DEF_PATH"
            echo "CONFIG_SND=y" >> "$DEF_PATH"
            echo "CONFIG_SND_SOC=y" >> "$DEF_PATH"
            echo "CONFIG_SND_SOC_MSM8X16_WCD=y" >> "$DEF_PATH"
            echo "CONFIG_SND_SOC_WCD9XXX=y" >> "$DEF_PATH"
            echo "CONFIG_SND_SOC_WCD934X=y" >> "$DEF_PATH"
            echo "CONFIG_SND_SOC_WCD_CPE=y" >> "$DEF_PATH"
            echo "CONFIG_MSM_QDSP6V2=y" >> "$DEF_PATH"
            echo "CONFIG_AUDIO_ADSP=y" >> "$DEF_PATH"
            echo "CONFIG_SND_SOC_MSM_QDSP6V2_INTF=y" >> "$DEF_PATH"
            echo "CONFIG_USB_AUDIO=y" >> "$DEF_PATH"
            echo "CONFIG_SND_USB_AUDIO=y" >> "$DEF_PATH"
            echo "CONFIG_SND_HRTIMER=y" >> "$DEF_PATH"
          fi

          if [ "$ENABLE_GPLAY" = "true" ]; then
            echo "" >> "$DEF_PATH"
            echo "# Google Play Integrity Bypass" >> "$DEF_PATH"
            echo "CONFIG_ANDROID_BINDER_IPC=y" >> "$DEF_PATH"
            echo "CONFIG_ANDROID_BINDERFS=y" >> "$DEF_PATH"
            echo "CONFIG_AUDIT=y" >> "$DEF_PATH"
            echo "CONFIG_AUDITSYSCALL=y" >> "$DEF_PATH"
            echo "CONFIG_OVERLAY_FS=y" >> "$DEF_PATH"
            echo "CONFIG_OVERLAY_FS_REDIRECT_DIR=y" >> "$DEF_PATH"
            echo "CONFIG_OVERLAY_FS_INDEX=y" >> "$DEF_PATH"
            echo "CONFIG_OVERLAY_FS_XINO_AUTO=y" >> "$DEF_PATH"
            echo "CONFIG_USER_NS=y" >> "$DEF_PATH"
            echo "CONFIG_PID_NS=y" >> "$DEF_PATH"
            echo "CONFIG_UTS_NS=y" >> "$DEF_PATH"
            echo "CONFIG_IPC_NS=y" >> "$DEF_PATH"
            echo "CONFIG_NET_NS=y" >> "$DEF_PATH"
          fi

          echo "=== Selesai. Baris defconfig: $(wc -l < $DEF_PATH) ==="

      - name: Setup KSU dan SuSFS symbols
        working-directory: kernel-source
        env:
          ENABLE_SUSFS: ${{ inputs.enable_susfs }}
        run: |
          echo "" >> "$DEF_PATH"
          echo "CONFIG_KSU=y" >> "$DEF_PATH"
          if [ "$ENABLE_SUSFS" = "true" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> "$DEF_PATH"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$DEF_PATH"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$DEF_PATH"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$DEF_PATH"
            echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> "$DEF_PATH"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$DEF_PATH"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$DEF_PATH"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$DEF_PATH"
          fi
          echo "=== KSU/SuSFS symbols selesai ==="

      - name: Buat runtime scripts ZRAM dan BBR
        run: |
          mkdir -p runtime-scripts/system/etc/init.d

          printf '%s\n' \
            '#!/system/bin/sh' \
            'ZRAM=/dev/block/zram0' \
            'MEM=$(grep MemTotal /proc/meminfo | awk "{print \$2}")' \
            'SIZE=$(( MEM / 2 / 1024 ))' \
            'swapoff $ZRAM 2>/dev/null || true' \
            'echo 1 > /sys/block/zram0/reset 2>/dev/null || true' \
            'echo lz4 > /sys/block/zram0/comp_algorithm 2>/dev/null || echo lzo > /sys/block/zram0/comp_algorithm 2>/dev/null || true' \
            'echo "${SIZE}M" > /sys/block/zram0/disksize' \
            'mkswap $ZRAM && swapon $ZRAM -p 32767' \
            'sysctl -w vm.swappiness=10' \
            'sysctl -w vm.dirty_ratio=20' \
            'sysctl -w vm.dirty_background_ratio=5' \
            'sysctl -w vm.vfs_cache_pressure=50' \
            > runtime-scripts/system/etc/init.d/00-zram.sh

          printf '%s\n' \
            '#!/system/bin/sh' \
            'AVAIL=$(cat /proc/sys/net/ipv4/tcp_available_congestion_control 2>/dev/null)' \
            'if echo "$AVAIL" | grep -q bbr2; then sysctl -w net.ipv4.tcp_congestion_control=bbr2' \
            'elif echo "$AVAIL" | grep -q bbr; then sysctl -w net.ipv4.tcp_congestion_control=bbr' \
            'fi' \
            'tc qdisc replace dev rmnet_data0 root cake bandwidth 100mbit 2>/dev/null || true' \
            'tc qdisc replace dev wlan0 root cake bandwidth 300mbit 2>/dev/null || true' \
            'sysctl -w net.ipv4.tcp_wmem="4096 87380 33554432"' \
            'sysctl -w net.ipv4.tcp_rmem="4096 87380 33554432"' \
            'sysctl -w net.core.wmem_max=33554432' \
            'sysctl -w net.core.rmem_max=33554432' \
            'sysctl -w net.ipv4.tcp_ecn=1' \
            'sysctl -w net.ipv4.tcp_fastopen=3' \
            'sysctl -w net.ipv4.tcp_mtu_probing=1' \
            > runtime-scripts/system/etc/init.d/01-bbr.sh

          chmod +x runtime-scripts/system/etc/init.d/00-zram.sh
          chmod +x runtime-scripts/system/etc/init.d/01-bbr.sh
          echo "=== Runtime scripts selesai ==="

      - name: Compile kernel
        working-directory: kernel-source
        env:
          ENABLE_SUSFS: ${{ inputs.enable_susfs }}
        run: |
          MAKE_ARGS=(
            O=out ARCH=arm64
            LLVM=1 LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            KCFLAGS=-Wno-error
          )

          make "${MAKE_ARGS[@]}" "$DEFCONFIG_REL"
          make "${MAKE_ARGS[@]}" olddefconfig

          echo "=== Cek KSU ==="
          grep -E "^CONFIG_KSU" out/.config || true
          grep -q "^CONFIG_KSU=y" out/.config || {
            echo "ERROR: CONFIG_KSU tidak aktif"
            exit 1
          }

          if [ "$ENABLE_SUSFS" = "true" ]; then
            grep -q "^CONFIG_KSU_SUSFS=y" out/.config || {
              echo "ERROR: CONFIG_KSU_SUSFS tidak aktif"
              exit 1
            }
          fi

          echo "=== Status fitur ==="
          grep -E "^CONFIG_(TCP_CONG_BBR|ZRAM|ENERGY_MODEL|GNSS|OVERLAY_FS|SND_SOC_WCD9XXX)" \
            out/.config || true

          make -j"$(nproc)" "${MAKE_ARGS[@]}" Image 2>&1 | tee build.log
          make "${MAKE_ARGS[@]}" modules_prepare

      - name: Build driver RTL8188EUS
        if: ${{ inputs.enable_rtl8188eus }}
        run: |
          git clone --depth=1 https://github.com/aircrack-ng/rtl8188eus.git rtl8188eus
          cd rtl8188eus
          MLFILE=$(grep -rl '^MODULE_LICENSE' . --include='*.c' | head -n1)
          if [ -n "$MLFILE" ] && ! grep -q 'MODULE_IMPORT_NS' "$MLFILE"; then
            sed -i '/^MODULE_LICENSE/a MODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);' "$MLFILE"
          fi
          KDIR="$GITHUB_WORKSPACE/kernel-source/out"
          if ! make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               KSRC="$KDIR" KCFLAGS=-Wno-error > /tmp/rtl.log 2>&1; then
            tail -n 20 /tmp/rtl.log
            echo "WARNING: RTL8188EUS gagal, kernel tetap lanjut"
            exit 0
          fi
          KO=$(find . -name '8188eu.ko' | head -n1)
          if [ -n "$KO" ]; then
            mkdir -p "$GITHUB_WORKSPACE/out-extra"
            cp "$KO" "$GITHUB_WORKSPACE/out-extra/8188eu.ko"
            echo "=== RTL8188EUS berhasil ==="
          fi

      - name: Bungkus AnyKernel3
        run: |
          IMG=kernel-source/out/arch/arm64/boot/Image
          test -f "$IMG" || { echo "ERROR: Image tidak terbentuk"; exit 1; }

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp "$IMG" AnyKernel3/Image
          cp -r runtime-scripts/. AnyKernel3/

          cd AnyKernel3
          sed -i \
            -e 's|^kernel.string=.*|kernel.string=Ginkgo/Willow RN8 - KSU+SuSFS+BBR2+GPS+Dolby+ZRAM|' \
            -e 's|^do.modules=.*|do.modules=0|' \
            -e 's|^device.name1=.*|device.name1=ginkgo|' \
            -e 's|^device.name2=.*|device.name2=willow|' \
            -e 's|^device.name3=.*|device.name3=trinket|' \
            -e 's|^device.name4=.*|device.name4=|' \
            -e 's|^device.name5=.*|device.name5=|' \
            -e 's|^BLOCK=.*|BLOCK=boot;|' \
            -e 's|^IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=0;|' \
            anykernel.sh

          zip -r9 "../$ZIP_NAME" . \
            -x '.git/*' -x '.github/*' \
            -x 'README.md' -x '*placeholder'

          cd ..
          test -f "$ZIP_NAME" || { echo "ERROR: ZIP tidak terbentuk"; exit 1; }
          echo "=== ZIP: $(du -sh $ZIP_NAME) ==="

      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: "GinkgoWillow-RN8-${{ github.run_number }}"
          path: ${{ env.ZIP_NAME }}

      - name: Upload RTL8188EUS driver
        if: ${{ inputs.enable_rtl8188eus }}
        uses: actions/upload-artifact@v4
        with:
          name: "RTL8188EUS-RN8-${{ github.run_number }}"
          path: out-extra/8188eu.ko
          if-no-files-found: ignore

      - name: Upload log jika gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-error
          path: kernel-source/build.log
          if-no-files-found: ignore

      - name: Build summary
        if: success()
        run: |
          echo "## Build Selesai - Redmi Note 8 Ginkgo/Willow" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fitur | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Device | ginkgo / willow (Redmi Note 8) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Chipset | Snapdragon 665 (trinket) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Root: ${{ inputs.root_solution }} (auto latest) | OK |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SuSFS branch | $SUSFS_BRANCH_RESOLVED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| FPS Gaming + BBR2 + GPS | OK |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ZRAM | ${{ inputs.enable_zram }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Overclock/UV | ${{ inputs.enable_overclock }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dolby Audio | ${{ inputs.enable_dolby }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| GPlay bypass | ${{ inputs.enable_gplay_bypass }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "KSU ref   : $KSU_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "SuSFS ref : $SUSFS_REF" >> "$GITHUB_STEP_SUMMARY"
          
