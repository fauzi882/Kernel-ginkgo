      - name: Buat Modul KernelSU/Magisk untuk Loadable Modules (.ko)
        if: ${{ inputs.nethunter }}
        shell: bash
        run: |
          # 1. Buat struktur folder standar modul Magisk/KSU
          mkdir -p nethunter_ksu_module/system/vendor/lib/modules
          
          # 2. Pindahkan semua .ko hasil compile ke folder modul
          find kernel/out -name "*.ko" -type f -exec cp {} nethunter_ksu_module/system/vendor/lib/modules/ \;
          
          # 3. Buat metadata modul (module.prop)
          cat > nethunter_ksu_module/module.prop <<'EOF'
          id=nethunter-ginkgo-modules
          name=NetHunter WiFi/BT Modules (Ginkgo)
          version=v1.0
          versionCode=1
          author=Flop Kernel Actions
          description=Systemless kernel modules (.ko) auto-installer & loader untuk perangkat NetHunter (WiFi eksternal, Bluetooth, dll).
          EOF
          
          # 4. Buat script service.sh untuk auto-load driver saat HP nyala
          cat > nethunter_ksu_module/service.sh <<'EOF'
          #!/system/bin/sh
          MODDIR=${0%/*}
          
          # Tunggu sistem selesai booting agar tidak membebani proses startup
          until [ "$(getprop sys.boot_completed)" = "1" ]; do
              sleep 2
          done
          
          # Eksekusi insmod untuk setiap file driver .ko yang ada
          for ko_file in $(find $MODDIR/system/vendor/lib/modules -name "*.ko"); do
              insmod "$ko_file"
          done
          EOF
          
          # 5. Beri izin eksekusi pada script
          chmod +x nethunter_ksu_module/service.sh
          
          # 6. Bungkus menjadi file ZIP siap flash
          cd nethunter_ksu_module
          zip -r9 ../NetHunter-KSU-Magisk-Module.zip .
          echo "Modul KSU/Magisk berhasil dibuat!"
          
