name: Recon 3 (cari driver RTL8188EUS di ikteach)

# Taruh di: .github/workflows/recon3-driver.yml
# Jalankan: Actions -> "Recon 3" -> Run workflow
# Hasil: Summary run + artifact report3.md

on:
  workflow_dispatch:

jobs:
  recon3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Intip driver custom
        shell: bash
        run: |
          set +e
          set +o pipefail
          R="$PWD/report3.md"
          : > "$R"
          sec() { printf '\n### %s\n```\n' "$1" >> "$R"; }
          end() { printf '```\n' >> "$R"; }
          x() { d="$1"; shift; ( cd "$d" && bash -c "$*" ) >> "$R" 2>&1; }

          timeout 900 git clone --depth=1 https://github.com/ikteach/ginkgo_nethunter_kernel.git /tmp/ik >/dev/null 2>&1
          timeout 900 git clone --depth=1 -b floppy-unity https://github.com/FlopKernel-Series/flop_trinket-mi_kernel.git /tmp/flop >/dev/null 2>&1

          echo "# Recon 3" >> "$R"

          sec "ikteach: folder bernama 8188 / 88xxau / 8812 / 8821 / 8822 (di luar rtlwifi)"
          x /tmp/ik "find drivers net -maxdepth 6 \( -iname '*8188*' -o -iname '*88xxau*' -o -iname '*8812*' -o -iname '*8821*' -o -iname '*8822*' -o -iname '*8192*' \) -not -path '*/rtlwifi/*' | head -50"
          end

          sec "Flop: folder yang sama (pembanding)"
          x /tmp/flop "find drivers net -maxdepth 6 \( -iname '*8188*' -o -iname '*88xxau*' -o -iname '*8812*' -o -iname '*8821*' -o -iname '*8822*' -o -iname '*8192*' \) -not -path '*/rtlwifi/*' | head -50"
          end

          sec "ikteach: di mana simbol driver custom didefinisikan (Kconfig/Makefile/Kbuild)"
          x /tmp/ik "grep -rnE 'RTL8188EU|88XXAU|RTL8822BU|RTL8812|RTL8814|NETHUNTER_' --include='Kconfig*' --include='Makefile' --include='Kbuild' drivers net | head -70"
          end

          sec "ikteach: Kconfig/Makefile induk wireless yang menyebut realtek"
          x /tmp/ik "grep -n -i realtek drivers/net/wireless/Kconfig drivers/net/wireless/Makefile; echo ---; ls drivers/net/wireless/realtek"
          end

          sec "Flop: hal yang sama"
          x /tmp/flop "grep -n -i realtek drivers/net/wireless/Kconfig drivers/net/wireless/Makefile; echo ---; ls drivers/net/wireless/realtek"
          end

          sec "Selisih drivers/net/wireless (hanya yang ada di salah satu sisi, maks 60)"
          x /tmp "diff -rq flop/drivers/net/wireless ik/drivers/net/wireless | grep -E '^Only in' | head -60"
          end

          sec "Selisih Kconfig/Makefile di drivers/net/wireless"
          x /tmp "diff -rq flop/drivers/net/wireless ik/drivers/net/wireless | grep -E 'Kconfig|Makefile|Kbuild' | head -30"
          end

          sec "Selisih net/mac80211 dan net/wireless (kandidat patch injeksi, maks 40)"
          x /tmp "diff -rq flop/net/mac80211 ik/net/mac80211 | head -40; echo ---; diff -rq flop/net/wireless ik/net/wireless | head -40"
          end

          sec "Selisih drivers/staging (hanya yang ada di salah satu sisi)"
          x /tmp "diff -rq flop/drivers/staging ik/drivers/staging | grep -E '^Only in' | head -30"
          end

          sec "Ukuran folder driver custom di ikteach"
          x /tmp/ik "du -sh drivers/net/wireless/realtek/* 2>/dev/null | sort -h | tail -15"
          end

          cat "$R"
          cat "$R" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload laporan
        uses: actions/upload-artifact@v4
        with:
          name: recon3
          path: report3.md
          
