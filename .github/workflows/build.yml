name: Build Ginkgo - FlopKernel + KernelSU-Next + SuSFS

# Install as .github/workflows/build-ginkgo.yml in your build repository.
# This workflow uses the source repository's own build driver instead of
# inventing Kconfig fragments or rewriting kernel symbols.

on:
  workflow_dispatch:
    inputs:
      flop_ref:
        description: "Branch, tag, or commit in FlopKernel source"
        required: true
        type: string
        default: "floppy-unity"
      clean_build:
        description: "Clean generated output before building"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-ginkgo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ginkgo (KernelSU + source-provided SuSFS)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      FLOP_REPO: https://github.com/FlopKernel-Series/flop_trinket-mi_kernel.git
      FLOP_REF: ${{ inputs.flop_ref }}
      CLEAN_BUILD: ${{ inputs.clean_build }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      ARCH: arm64

    steps:
      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git libelf-dev \
            libssl-dev lld llvm clang gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi make pahole perl python3 rsync unzip zip \
            wget xz-utils zstd device-tree-compiler gnupg software-properties-common
          wget -q https://apt.llvm.org/llvm.sh -O /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 19
          sudo apt-get install -y llvm-19 lld-19 clang-19

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ginkgo-ccache-${{ runner.os }}-${{ inputs.flop_ref }}-${{ github.run_id }}
          restore-keys: |
            ginkgo-ccache-${{ runner.os }}-${{ inputs.flop_ref }}-
            ginkgo-ccache-${{ runner.os }}-

      - name: Clone FlopKernel source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none "$FLOP_REPO" kernel
          git -C kernel fetch --depth=1 origin "$FLOP_REF"
          git -C kernel checkout --detach FETCH_HEAD
          echo "SOURCE_SHA=$(git -C kernel rev-parse HEAD)" >> "$GITHUB_ENV"
          git -C kernel log -1 --format='%H%n%cs%n%s' | tee source-revision.txt
          test -x kernel/do_build.sh || { echo 'do_build.sh tidak ditemukan/ tidak executable'; exit 1; }
          test -f kernel/ckbuild.sh || { echo 'ckbuild.sh tidak ditemukan; build driver source tidak lengkap'; exit 1; }

      - name: Check source integration and build entrypoints
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail
          {
            echo '## Source revision'
            echo '```'
            git log -1 --format='%H%n%cs%n%s'
            echo '```'
            echo '## KernelSU / SuSFS source markers'
            echo '```'
            git grep -n -i -E 'KernelSU.?Next|SUSFS|CONFIG_KSU_SUSFS|susfs' -- \
              'Kconfig*' 'arch/arm64/configs/**' 'drivers/**' 'fs/**' \
              'floppy_utils/**' 'ckbuild.sh' 'do_build.sh' 2>/dev/null | head -160 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # The source's own driver is the authority for its Kconfig, toolchain,
          # patches, and output paths. Do not synthesize CONFIG_KSU_NEXT or
          # SUSFS symbols: those names vary between kernel forks.
          grep -q 'ck_script="ckbuild.sh"' do_build.sh

      - name: Configure build environment
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$CCACHE_DIR"
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE/kernel" >> "$GITHUB_ENV"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --zero-stats || true
          clang --version
          ld.lld --version

      - name: Build ginkgo with source build driver
        shell: bash
        working-directory: kernel
        run: |
          set -o pipefail
          if [[ "$CLEAN_BUILD" == "true" ]]; then
            # Clean only generated kernel outputs; do not delete source or patches.
            rm -rf out
          fi
          # In this repository's do_build.sh, option 'k' selects its KernelSU build.
          # SuSFS is not injected here: it must be provided by the selected source ref.
          bash ./do_build.sh ginkgo k 2>&1 | tee ../build.log

      - name: Verify final config and locate outputs
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo '## Build verification'
            echo '```'
            echo "source_sha=${SOURCE_SHA:-unknown}"
            find kernel -type f \( -name '.config' -o -name 'Image.gz-dtb' -o -name 'Image.gz' -o -name 'Image' -o -name '*.zip' \) \
              -not -path '*/.git/*' -printf '%p (%s bytes)\n' | head -250
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          CONFIG=$(find kernel -type f -path '*/.config' -not -path '*/.git/*' -print -quit)
          if [[ -n "$CONFIG" ]]; then
            cp "$CONFIG" final.config
            grep -E '^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KSU_SUSFS_[A-Z0-9_]+)=' "$CONFIG" > ksu-susfs.config-summary || true
            cat ksu-susfs.config-summary || true
            if ! grep -q '^CONFIG_KSU=y$' "$CONFIG"; then
              echo '::error::Final config does not show CONFIG_KSU=y; do not flash this build.'
              exit 1
            fi
            if ! grep -q '^CONFIG_KSU_SUSFS=y$' "$CONFIG"; then
              echo '::error::CONFIG_KSU_SUSFS=y was not found. SuSFS is not verified; refusing to label this as a SuSFS build.'
              exit 1
            fi
          else
            echo '::warning::No .config found to verify; inspect build.log before using any output.'
          fi
          exit 0

      - name: Collect build outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp -f build.log source-revision.txt artifacts/ 2>/dev/null || true
          cp -f final.config ksu-susfs.config-summary artifacts/ 2>/dev/null || true
          # Preserve source-generated flashable packages if the source driver made any.
          find kernel -type f -name '*.zip' -not -path '*/.git/*' -exec cp -n {} artifacts/ \; 2>/dev/null || true
          # Keep kernel images for diagnostics, but do not call them flashable ZIPs.
          find kernel -type f \( -name 'Image.gz-dtb' -o -name 'Image.gz' -o -name 'Image' -o -name '*.dtb' -o -name '*.dtbo' \) \
            -not -path '*/.git/*' -exec cp -n --parents {} artifacts/ \; 2>/dev/null || true
          test -n "$(find artifacts -type f -print -quit)"

      - name: Upload build artifacts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ginkgo-ksunext-susfs-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: ccache statistics
        if: always()
        shell: bash
        run: ccache --show-stats || true
        
